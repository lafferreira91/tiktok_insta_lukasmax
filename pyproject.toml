[project]
name = "lukasmax-social-automation"
version = "0.1.0"
description = "Automacao gratuita de TikTok para Instagram Reels"
requires-python = ">=3.11"
dependencies = [
  "imageio-ffmpeg>=0.6.0",
  "python-dotenv>=1.1.0",
  "yt-dlp[default]>=2026.7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lukasmax = "lukasmax_automation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lukasmax_automation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
