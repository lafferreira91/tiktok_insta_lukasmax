name: Publicar Reels agendados

# A Content Publishing API do Instagram nao tem agendamento nativo: media_publish
# publica sempre na hora. Por isso o agendamento e este cron, que acorda e
# publica o que estiver vencido. O scheduled_at da fila e um piso, nao um
# horario exato -- o cron do GitHub Actions e best-effort e atrasa sob carga.
#
# A janela cobre 08:00-22:59 no horario de Brasilia (11-23, 0 e 1 UTC, sem
# horario de verao no Brasil desde 2019). Os slots vao de 09:15 a 21:15 e o
# jitter e de no maximo 20 minutos, entao o mais tardio vence as 21:35 locais =
# 00:35 UTC. As demais horas da madrugada ficam fora: ali a fila esta sempre
# vazia.
#
# Por que a hora 1 existe, sendo que nada vence nela: em 15/08/2026 as DUAS
# execucoes da hora 0 (00:13 e 00:43 UTC) simplesmente nao rodaram, e o post das
# 21:26 teve de ser disparado a mao. Meia-noite UTC e o momento de maior carga do
# GitHub -- e o mesmo motivo pelo qual os minutos 13 e 43 evitam o topo da hora,
# so que na escala da hora. A hora 1 e a rede de seguranca: sem ela, uma hora 0
# descartada empurra o post da noite para as 08:13 do dia seguinte, oito horas
# fora do horario e ainda por cima poluindo a medicao do slot da manha.
#
# Por que a cada 30 minutos e nao cravado na hora do slot: a documentacao do
# GitHub avisa que execucoes agendadas atrasam sob carga e que, se a carga for
# alta, "alguns jobs podem ser descartados". Com muitas janelas por dia, um job
# perdido custa 30 minutos; com uma janela por slot, custaria o post.
#
# O teste tests/test_cron_cobre_os_slots.py amarra esta janela ao pool de
# horarios -- foi ele que pegou o slot das 21:15 caindo fora dela.
on:
  schedule:
    - cron: "13,43 0-1,11-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mostrar o que faria sem publicar"
        type: boolean
        default: false
      max_per_run:
        description: "Maximo de posts nesta execucao"
        type: string
        default: "1"

# O push da fila e o lock que impede dois runs de reivindicarem o mesmo item.
# Sem isso, duas execucoes sobrepostas poderiam publicar o mesmo Reel duas vezes.
concurrency:
  group: publish-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # A publicacao nasce desligada: ligar exige mudar a variable no repositorio.
    if: github.event_name == 'workflow_dispatch' || vars.PUBLISH_ENABLED == 'true'
    env:
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v26.0' }}
      PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Sem --extra local: o publicador so fala HTTP com a Graph API e nunca
      # toca no arquivo de video, entao yt-dlp, ffmpeg e PyAV ficam de fora.
      - name: Instalar dependencias minimas
        run: uv sync --frozen

      - name: Checagem previa
        run: uv run lukasmax doctor

      # Sempre antes de publicar: resolve qualquer item que ficou preso em
      # 'publishing' por um run que morreu no meio.
      - name: Reconciliar publicacoes interrompidas
        run: uv run lukasmax reconcile

      - name: Publicar o que estiver vencido
        run: |
          uv run lukasmax publish-due \
            --max-per-run "${{ inputs.max_per_run || 1 }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Gravar o estado da fila
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Nada mudou na fila."
            exit 0
          fi
          git config user.name  "lukasmax-bot"
          git config user.email "lukasmax-bot@users.noreply.github.com"
          git add data/

          # Um push rejeitado significa que outra execucao escreveu antes. Refaz
          # o ciclo inteiro sobre o estado novo em vez de forcar por cima.
          for attempt in 1 2 3; do
            git commit -m "Estado da fila apos o run ${GITHUB_RUN_ID}" || break
            if git push; then
              exit 0
            fi
            echo "Push rejeitado (tentativa ${attempt}); rebaseando."
            git reset --soft HEAD~1
            git stash --include-untracked || true
            git pull --rebase --autostash
            git stash pop || true
          done
          echo "Nao consegui gravar a fila apos 3 tentativas." >&2
          exit 1
