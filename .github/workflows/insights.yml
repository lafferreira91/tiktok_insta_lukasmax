name: Coletar metricas dos Reels

# Insight nao e recuperavel depois: a Meta nao devolve "qual era o alcance nas
# primeiras 24h" retroativamente. Cada dia sem este job e um dia de dado perdido
# para sempre -- e o unico motivo de ele existir com prazo.
#
# Uma vez por dia as 05:07 UTC (02:07 em Brasilia). Duas razoes para o horario:
# fica fora da janela 11-23 UTC do publish.yml, e o minuto 7 evita o topo da
# hora, que a documentacao do GitHub aponta como pico de carga.
#
# So faz GET na Meta. Nao publica nada, entao nao passa perto das travas de
# publicacao.
on:
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mostrar o que coletaria sem gravar"
        type: boolean
        default: false

# MESMO grupo do publish.yml, de proposito. Os dois commitam em data/, e sem
# isto o loop de rebase daquele job -- hoje um caminho frio, nunca exercitado sob
# concorrencia real -- viraria caminho quente em producao.
concurrency:
  group: publish-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    env:
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v26.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Sem --extra local: o coletor so fala HTTP com a Graph API.
      - name: Instalar dependencias minimas
        run: uv sync --frozen

      - name: Coletar
        run: |
          uv run lukasmax collect-insights \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Gravar o CSV
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Nada novo para coletar."
            exit 0
          fi
          git config user.name  "lukasmax-bot"
          git config user.email "lukasmax-bot@users.noreply.github.com"
          git add data/

          # Mesmo ciclo do publish.yml: push rejeitado significa que a outra
          # execucao escreveu antes; refaz sobre o estado novo em vez de forcar.
          for attempt in 1 2 3; do
            git commit -m "Metricas coletadas no run ${GITHUB_RUN_ID}" || break
            if git push; then
              exit 0
            fi
            echo "Push rejeitado (tentativa ${attempt}); rebaseando."
            git reset --soft HEAD~1
            git stash --include-untracked || true
            git pull --rebase --autostash
            git stash pop || true
          done
          echo "Nao consegui gravar o CSV apos 3 tentativas." >&2
          exit 1
